name: Refresh China Toy Atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/china-toys-refresh.yml'
      - 'china-toys/sources.json'
      - 'china-toys/refresh.py'
      - 'china-toys/enhance.py'
      - 'china-toys/rolife_collection.py'
      - 'china-toys/quality.py'
      - 'china-toys/weekly_brief_test.py'
      - 'china-toys/compare_test.py'
      - 'china-toys/chain_coverage_test.py'
      - 'china-toys/apply_chain_coverage.py'
      - 'china-toys/test_chain_report_consistency.py'
      - '.github/scripts/push-generated.sh'
      - '.github/scripts/test_push_generated.py'
      - '.github/scripts/test_writer_workflows.py'
      - 'china-toys/enrichment.json'
      - 'china-toys/build_ip_directory.py'
      - 'china-toys/test_refresh_contract.py'
      - 'china-toys/validate_refresh_contract.py'
      - 'china-toys/research-history.json'
      - '.github/scripts/pages/build-directories.py'
      - '.github/scripts/pages/directory/**'
      - '.github/scripts/pages/directory.test.cjs'
  schedule:
    - cron: '30 1 * * *' # Daily 09:30 Asia/Shanghai (UTC+8)
permissions:
  contents: write
  actions: write
concurrency:
  group: china-toys-generated-writers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collection and validation dependencies
        run: |
          pip install requests beautifulsoup4 Pillow playwright
          python -m playwright install --with-deps chromium webkit
      - name: Validate code
        run: |
          python -m py_compile china-toys/rolife_collection.py china-toys/refresh.py china-toys/enhance.py china-toys/quality.py china-toys/review.py china-toys/review_finalize.py china-toys/review_publish.py china-toys/navigation_fix.py china-toys/navigation_test.py china-toys/install_compare.py china-toys/compare_test.py
          node --check china-toys/app.js
          node --check china-toys/compare.js
      - name: Test generated-data maintenance
        run: |
          python china-toys/test_refresh_contract.py
          python china-toys/test_chain_report_consistency.py
          python .github/scripts/test_push_generated.py
          python .github/scripts/test_writer_workflows.py
          bash -n .github/scripts/push-generated.sh
      - name: Check market price grouping
        run: python china-toys/market_prices_test.py
      - name: Snapshot preservation baseline
        run: python china-toys/validate_refresh_contract.py snapshot --baseline /tmp/china-toys-baseline.json
      - name: Collect products and preserve exact-item evidence
        run: |
          python china-toys/apply_source_audit.py --config
          python china-toys/enhance.py
          python china-toys/quality.py
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('china-toys/catalog.json');d=json.loads(p.read_text())
          if not any(s.get('status')=='complete' for s in d.get('sources',[])):
            raise RuntimeError('No source completed; refusing to publish a false successful refresh')
          d['last_full_collection']=d['updated'];p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')))
          PY
          python china-toys/review_publish.py
          python china-toys/apply_chain_coverage.py --cache-images
          python china-toys/build_chain_assortments.py --check-sources
          python china-toys/apply_source_audit.py
          python china-toys/build_ip_directory.py
          python china-toys/build_brand_directory.py
          python china-toys/navigation_fix.py
          python china-toys/install_weekly_brief.py
          python china-toys/install_compare.py
          python china-toys/install_item_insights.py
          node --check china-toys/app.js
          node --check china-toys/catalog-guide.js
          node --check china-toys/compare.js
      - name: Preserve superseded research as historical evidence
        run: python china-toys/validate_refresh_contract.py archive --baseline /tmp/china-toys-baseline.json
      - name: Validate retained source-page compatibility
        run: |
          python china-toys/review_acceptance.py
          python china-toys/weekly_brief_test.py
          python china-toys/china_intelligence_test.py
          python china-toys/navigation_test.py
          python china-toys/test_ip_directory.py
          python china-toys/compare_test.py
          python china-toys/clarity_test.py
          python china-toys/chain_coverage_test.py
          python china-toys/brand_directory_test.py
      - name: Build and validate simplified directory data
        id: staged
        run: |
          mkdir -p _site
          cp -R home-care/site _site/home-care
          cp -R china-toys _site/china-toys
          node china-toys/apply-product-scope.mjs _site/china-toys
          python china-toys/build_source_audit_report.py
          python china-toys/apply_source_audit.py --site _site/china-toys
          python china-toys/market_prices_test.py
          python luggage-atlas/validate.py
          cp -R luggage-atlas _site/luggage-atlas
          python .github/scripts/pages/build-directories.py
          node --check .github/scripts/pages/directory/app.js
          node --test .github/scripts/pages/directory.test.cjs
      - name: Verify research preservation
        run: python china-toys/validate_refresh_contract.py preservation --baseline /tmp/china-toys-baseline.json
      - name: Validate simplified directory browser flows
        if: ${{ !cancelled() && steps.staged.outcome == 'success' }}
        run: python china-toys/validate_refresh_contract.py site --site _site/china-toys --browser
      - name: Save directory changes
        run: |
          git config user.name 'China Toy Atlas updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add china-toys/research-history.json
          git add china-toys/brand-directory-data.json china-toys/brand-directory-data.js china-toys/brands.html
          git add china-toys/chain-assortments-data.js china-toys/chain-assortments.csv china-toys/CHAIN_ASSORTMENT_REVIEW.md china-toys/chain-source-health.json
          git add china-toys/catalog.json china-toys/catalog.js china-toys/catalog.csv china-toys/report.json china-toys/research-queue.json china-toys/images china-toys/source-leads.json china-toys/review-report.json china-toys/review-media china-toys/app.js china-toys/index.html china-toys/catalog-guide.js china-toys/ip-market-data.js china-toys/ip-coverage.json china-toys/review_publish.py china-toys/build_ip_directory.py china-toys/compare.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh source-backed product specs, photos, prices and weekly changes'
            bash .github/scripts/push-generated.sh
          fi
      - name: Keep audit and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-toys-audit
          path: |
            /tmp/china-toys-baseline.json
            /tmp/china-toys-directory-qa/
            china-toys/catalog.json
            china-toys/ip-coverage.json
            china-toys/research-history.json
            china-toys/report.json
            china-toys/review-report.json
            /tmp/china-toys-review-qa/results.json
            /tmp/china-toys-review-qa/*.png
            /tmp/china-toys-weekly-brief-qa/
            /tmp/china-toys-china-desk-qa/
            /tmp/china-toys-navigation-qa/
            /tmp/china-toys-compare-audit/
          retention-days: 14
      - name: Publish updated public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main

# Daily refresh cadence: 09:30 Asia/Shanghai; keep public URL unchanged.


