name: Refresh China Toy Atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'china-toys/sources.json'
      - 'china-toys/refresh.py'
      - 'china-toys/enrichment.json'
      - '.github/workflows/china-toys-refresh.yml'
  schedule:
    - cron: '30 0 * * 1'
permissions:
  contents: write
  actions: write
concurrency:
  group: china-toys-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collection dependencies
        run: pip install requests beautifulsoup4 Pillow
      - name: Collect documented products and cache real product images
        run: python china-toys/refresh.py
      - name: Save directory changes
        run: |
          git config user.name 'China Toy Atlas updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add china-toys/catalog.json china-toys/catalog.js china-toys/catalog.csv china-toys/report.json china-toys/research-queue.json china-toys/images
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh China Toy Atlas product evidence and images'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              git push origin HEAD:main && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Save audit report
        uses: actions/upload-artifact@v4
        with:
          name: china-toys-audit
          path: |
            china-toys/report.json
            china-toys/research-queue.json
            china-toys/catalog.json
          retention-days: 14
      - name: Publish updated public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
