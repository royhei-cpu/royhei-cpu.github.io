name: Check China Toy Atlas UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['china-toys/brand_directory_test.py', 'china-toys/refresh_brand_discovery.py', 'china-toys/brands*', 'china-toys/brand-*', 'china-toys/build_brand_directory.py', 'china-toys/atlas-navigation*', 'china-toys/simple-navigation.js', 'china-toys/retail-chains.js', 'china-toys/atlas-sound.js', 'china-toys/research*', 'china-toys/build_source_audit_report.py', 'china-toys/app.js', 'china-toys/index.html', 'china-toys/styles.css', 'china-toys/china-intelligence*', 'china-toys/china-market-data.js', 'china-toys/china_intelligence_test.py', '.github/workflows/china-toys-ui-check.yml']
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          pip install playwright requests beautifulsoup4 Pillow
          python -m playwright install --with-deps chromium
      - name: Apply final product evidence guards to test data
        run: |
          python china-toys/quality.py
          python china-toys/apply_chain_coverage.py --cache-images
      - name: Check desktop and mobile interactions
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('/tmp/china-toys-ui');out.mkdir(exist_ok=True)
          server=subprocess.Popen([sys.executable,'-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          checks=[]; errors=[]
          try:
            with sync_playwright() as pw:
              browser=pw.chromium.launch()
              page=browser.new_page(viewport={'width':1440,'height':1080},device_scale_factor=1)
              page.on('pageerror',lambda e:errors.append(str(e)))
              def images_ready():
                page.wait_for_function('''() => [...document.images].filter(e => {const r=e.getBoundingClientRect();return e.checkVisibility()&&r.width>0&&r.height>0&&r.top<innerHeight&&r.bottom>0&&r.left<innerWidth&&r.right>0}).every(e=>e.complete&&e.naturalWidth>0)''',timeout=30000)
              page.goto('http://127.0.0.1:8765/china-toys/',wait_until='networkidle')
              page.wait_for_selector('.product-card')
              assert page.locator('.product-card').count()==24
              images_ready()
              page.screenshot(path=str(out/'desktop.png'),full_page=False)
              page.locator('#catalogGrid').evaluate('(e)=>e.scrollIntoView({block:"start"})')
              images_ready()
              page.screenshot(path=str(out/'desktop-products.png'),full_page=False)
              checks.append('Desktop grid and visible real photographs: pass')
              assert page.locator('#atlasBrandNav a').count()==6
              assert not page.locator('#chinaIntelligencePanel').evaluate('(e)=>e.open')
              assert not page.locator('.atlas-more-filters').evaluate('(e)=>e.open')
              assert page.locator('#retailChains [role="tab"]').count()==11
              page.get_by_role('tab',name='TOP TOY',exact=True).click()
              assert page.locator('#chainDetail h3').inner_text()=='TOP TOY'
              assert page.locator('#chainDetail article').count()==1
              page.get_by_role('tab',name='TOP TOY',exact=True).press('ArrowRight')
              assert page.locator('#chainDetail h3').inner_text()=='52TOYS'
              page.get_by_role('tab',name='POP MART',exact=True).click()
              page.locator('#atlasBrandNav a[href="#browseToys"]').click()
              assert page.locator('#brandSelect').is_visible()
              page.locator('.atlas-more-filters summary').click()
              assert page.locator('#sort').is_visible()
              page.locator('.atlas-more-filters summary').click()
              page.locator('#atlasSound').click()
              assert page.locator('#atlasSound').inner_text()=='♫ Sound off'
              page.reload(wait_until='networkidle')
              assert page.locator('#atlasSound').inner_text()=='♫ Sound off'
              checks.append('Six navigation links; eleven keyboard-accessible retail tabs; expandable filters; persistent mute: pass')
              for brand in ['POP MART','TOP TOY']:
                page.locator('#brandSelect').select_option(brand)
                assert page.locator('#resultsTitle').inner_text()==brand
                assert page.locator('.product-card').count()>0
                checks.append(brand+' brand selector: pass')
              page.locator('.card-footer button[data-open]').first.click()
              assert page.locator('#productDialog').evaluate('(e)=>e.open')
              assert page.locator('#detailTitle').inner_text()
              images_ready()
              page.screenshot(path=str(out/'product-details.png'),full_page=False)
              page.locator('#closeProduct').click()
              assert not page.locator('#productDialog').evaluate('(e)=>e.open')
              checks.append('Product detail dialog opens and closes: pass')
              page.locator('#resetFilters').click()
              page.locator('#search').fill('labubu')
              assert page.locator('.product-card').count()>0
              checks.append('LABUBU search: pass')
              page.locator('#resetFilters').click()
              page.locator('#category').select_option('Squishy toys')
              assert page.locator('.product-card').count()>0
              page.locator('.save-button').first.click()
              assert page.locator('#savedCount').inner_text()=='1'
              checks.append('Squishy filter and shortlist bookmark: pass')
              page.locator('#resetFilters').click()
              page.locator('.view-tab[data-view="timeline"]').click()
              assert page.locator('.timeline-item').count()>0
              checks.append('Release timeline: pass')
              page.locator('.view-tab[data-view="trending"]').click()
              checks.append('Trend view: '+page.locator('#resultsHint').inner_text())
              page.locator('.view-tab[data-view="coverage"]').click()
              assert page.locator('#coveragePanel table').count()>=1
              checks.append('Coverage table: pass')
              page.locator('.view-tab[data-view="catalog"]').click()
              page.set_viewport_size({'width':390,'height':844})
              page.evaluate('window.scrollTo(0,0)')
              page.screenshot(path=str(out/'mobile-top.png'),full_page=False)
              assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth+1')
              page.locator('#category').select_option('Squishy toys')
              page.locator('#catalogGrid').evaluate('(e)=>e.scrollIntoView({block:"start"})')
              images_ready()
              page.screenshot(path=str(out/'mobile-products.png'),full_page=False)
              checks.append('390px mobile layout and visible squishy photographs: pass')
              assert not errors,errors
              checks.append('JavaScript runtime errors: none')
              browser.close()
          finally:
            server.terminate()
            (out/'results.json').write_text(json.dumps({'checks':checks,'errors':errors},indent=2))
            print(json.dumps({'checks':checks,'errors':errors},indent=2))
          PY
      - name: Check China research dashboard
        run: |
          python china-toys/build_brand_directory.py
          python china-toys/china_intelligence_test.py
          python china-toys/brand_directory_test.py
      - name: Keep review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-toys-ui-review
          path: |
            /tmp/china-toys-ui/
            /tmp/china-toys-china-desk-qa/
          retention-days: 7

