name: Check China Toy Atlas UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['china-toys/chain-assortment*', 'china-toys/brand_directory_test.py', 'china-toys/refresh_brand_discovery.py', 'china-toys/brands*', 'china-toys/brand-*', 'china-toys/build_brand_directory.py', 'china-toys/atlas-navigation*', 'china-toys/simple-navigation.js', 'china-toys/retail-chains.js', 'china-toys/atlas-sound.js', 'china-toys/research*', 'china-toys/build_source_audit_report.py', 'china-toys/app.js', 'china-toys/index.html', 'china-toys/styles.css', 'china-toys/china-intelligence*', 'china-toys/china-market-data.js', 'china-toys/china_intelligence_test.py', '.github/workflows/china-toys-ui-check.yml']
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          pip install playwright requests beautifulsoup4 Pillow
          python -m playwright install --with-deps chromium
      - name: Apply final product evidence guards to test data
        run: |
          python china-toys/quality.py
          python china-toys/apply_chain_coverage.py --cache-images
          python china-toys/build_chain_assortments.py
      - name: Check desktop and mobile interactions
        run: python china-toys/workspace_acceptance.py
      - name: Check China research dashboard
        run: |
          python china-toys/build_brand_directory.py
          python china-toys/china_intelligence_test.py
          python china-toys/brand_directory_test.py
      - name: Keep review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-toys-ui-review
          path: |
            /tmp/china-toys-ui/
            /tmp/china-toys-workspace-qa/
            /tmp/china-toys-china-desk-qa/
          retention-days: 7

