name: Publish Tariff Signal Mirror
on:
  push:
    branches: [main]
    paths: ['dog-club/**', 'pawlish/**', 'home-care/**', 'china-toys/**', 'luggage-atlas/**', 'tariff-signal/**', '.github/scripts/pages/**', '.github/workflows/publish.yml']
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main after acquiring the Pages lock
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage last complete Tariff homepage
        run: bash .github/scripts/pages/snapshot-ref.sh read _site
      - name: Add Pawlish English tutor
        run: python3 pawlish/download_assets.py _site/pawlish
      - name: Verify and build Homecare global listings and workshop
        run: |
          npm ci --prefix home-care/ui-src
          npm run build --prefix home-care/ui-src
          node --test home-care/navigation.test.mjs home-care/ui-src/upgrade.test.mjs home-care/homecare-upgrade.test.mjs home-care/tutorial-media/guide.test.mjs home-care/sales-ranking-model.test.cjs home-care/merchant-analytics-model.test.cjs home-care/opportunity-model.test.cjs home-care/brand-factory-build.test.mjs
      - name: Optimize Home Care page for fast loading
        run: node home-care/optimize-loading.mjs
      - name: Assemble current Homecare tutorial
        run: python3 home-care/tutorial-media/assemble.py
      - name: Add Home Care catalog
        run: cp -R home-care/site _site/home-care
      - name: Add China Toy Atlas
        run: |
          if [ -f china-toys/catalog.json ]; then
            python3 china-toys/apply_chain_coverage.py --cache-images
            python3 china-toys/build_chain_assortments.py
            python3 china-toys/build_brand_directory.py
            python3 china-toys/update_usd_rates.py
            python3 china-toys/build_planogram.py
            python3 china-toys/build_retailer_stories.py --refresh-feeds
            mkdir -p _site/china-toys
            cp china-toys/brands.html china-toys/brands.js china-toys/brands.css china-toys/brand-directory-data.js china-toys/brand-directory-data.json china-toys/brand-registry.json china-toys/brand-discovery.json _site/china-toys/
            cp china-toys/item-insights.js china-toys/retail-chains.js china-toys/atlas-sound.js china-toys/simple-navigation.js china-toys/atlas-navigation.js china-toys/atlas-navigation.css china-toys/china-intelligence.js china-toys/china-intelligence.css china-toys/china-market-data.js china-toys/market-prices.js china-toys/index.html china-toys/styles.css china-toys/app.js china-toys/catalog.js china-toys/catalog.json china-toys/catalog.csv china-toys/report.json _site/china-toys/
            cp china-toys/chain-assortments.json china-toys/chain-assortments-data.js china-toys/chain-assortment-ui.js china-toys/chain-assortments.css china-toys/chain-assortments.csv china-toys/chain-coverage.json china-toys/CHAIN_ASSORTMENT_REVIEW.md _site/china-toys/
            cp china-toys/workshop-flow.css china-toys/retail-brand-data.js china-toys/retail-artwork.js china-toys/retail-pack-data.js china-toys/currency.js china-toys/product-scope.js china-toys/planogram.js china-toys/planogram.css china-toys/retail-data.js china-toys/retail-studio.js china-toys/retail-studio.css china-toys/retail-scene.js _site/china-toys/
            cp china-toys/retailer-stories.js china-toys/retailer-stories.css china-toys/retailer-stories-data.js china-toys/retailer-stories-data.json _site/china-toys/
            node china-toys/apply-product-scope.mjs _site/china-toys
            mkdir -p _site/china-toys/retail
            cp china-toys/retail/*.jpg china-toys/retail/studio-lighting.hdr china-toys/retail/fx-rates.json china-toys/retail/blender_import.py china-toys/retail/THIRD_PARTY_LICENSE.txt _site/china-toys/retail/
            cp -R china-toys/images _site/china-toys/images
          fi
      - name: Copy China Toy tutorial and facts guide
        run: |
          if [ -f china-toys/catalog-guide.js ]; then cp china-toys/catalog-guide.js _site/china-toys/; fi
          if [ -d china-toys/tutorial ]; then cp -R china-toys/tutorial _site/china-toys/tutorial; fi
          if [ -f china-toys/compare.js ]; then cp china-toys/compare.js _site/china-toys/; fi
      - name: Copy China Toy IP ranking assets
        run: |
          if [ -f china-toys/ip-market-data.js ]; then
            cp china-toys/ip-market-data.js china-toys/ip-directory.js china-toys/ip-market.json china-toys/ip-coverage.json _site/china-toys/
          fi
      - name: Check market price grouping
        run: python3 china-toys/market_prices_test.py
      - name: Add dated source audit and exact-offer corrections
        run: |
          python3 china-toys/build_source_audit_report.py
          python3 china-toys/apply_source_audit.py --site _site/china-toys
          cp china-toys/research.html china-toys/research.css china-toys/research.js china-toys/source-audit.json china-toys/source-audit-data.js china-toys/source-audit.js _site/china-toys/
      - name: Add Luggage Atlas research
        run: |
          python3 luggage-atlas/validate.py
          node --check luggage-atlas/app.js
          cp -R luggage-atlas _site/luggage-atlas
      - name: Add Dog Club profile and comparison
        run: cp -R dog-club _site/dog-club
      - name: Verify source records and stamp the release
        run: python3 .github/scripts/pages/release.py manifest
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public pages and browser catalogs
        run: python3 .github/scripts/pages/release.py verify
