name: Publish Tariff Signal Mirror
on:
  push:
    branches: [main]
    paths: ['pawlish/**', 'home-care/**', 'china-toys/**', '.github/workflows/publish.yml']
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout website sources
        uses: actions/checkout@v4
      - name: Mirror complete public dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          import html, os, time
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          origin = "https://tariff-signal-sourcing.lhei111.chatgpt.site/"
          headers = {"User-Agent": "Mozilla/5.0 Tariff-Signal-Mirror", "Cache-Control": "no-cache"}

          from urllib.request import Request, urlopen
          def fetch(url):
              with urlopen(Request(url, headers=headers), timeout=45) as response:
                  return response.read()

          document = fetch(origin + "?mirror=" + str(int(time.time())))
          os.makedirs("_site", exist_ok=True)
          with open("_site/index.html", "wb") as output:
              output.write(document)

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ("href", "src"):
                      value = html.unescape(values.get(key, ""))
                      if value.startswith("/") and not value.startswith("//"):
                          self.urls.add(value)

          parser = Assets()
          parser.feed(document.decode("utf-8"))
          copied = 0
          for asset in sorted(parser.urls):
              parsed = urlparse(asset)
              path = parsed.path.lstrip("/")
              if not path or path.endswith("/"):
                  continue
              try:
                  payload = fetch(urljoin(origin, asset))
              except Exception as error:
                  print("skipped", asset, error)
                  continue
              target = os.path.join("_site", path)
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with open(target, "wb") as output:
                  output.write(payload)
              copied += 1
              print("mirrored", path)
          if copied < 3:
              raise RuntimeError("Expected dashboard assets were not copied")
          open("_site/.nojekyll", "w").close()
          PY
      - name: Add Pawlish English tutor
        run: python3 pawlish/download_assets.py _site/pawlish
      - name: Optimize Home Care page for fast loading
        run: node home-care/optimize-loading.mjs
      - name: Assemble narrated Home Care tutorial
        run: python3 home-care/tutorial-media/assemble.py
      - name: Add Home Care catalog
        run: cp -R home-care/site _site/home-care
      - name: Add China Toy Atlas
        run: |
          if [ -f china-toys/catalog.json ]; then
            python3 china-toys/build_brand_directory.py
            mkdir -p _site/china-toys
            cp china-toys/brands.html china-toys/brands.js china-toys/brands.css china-toys/brand-directory-data.js china-toys/brand-directory-data.json china-toys/brand-registry.json china-toys/brand-discovery.json _site/china-toys/
            cp china-toys/retail-chains.js china-toys/atlas-sound.js china-toys/simple-navigation.js china-toys/atlas-navigation.js china-toys/atlas-navigation.css china-toys/china-intelligence.js china-toys/china-intelligence.css china-toys/china-market-data.js china-toys/market-prices.js china-toys/index.html china-toys/styles.css china-toys/app.js china-toys/catalog.js china-toys/catalog.json china-toys/catalog.csv china-toys/report.json _site/china-toys/
            cp -R china-toys/images _site/china-toys/images
          fi
      - name: Copy China Toy tutorial and facts guide
        run: |
          if [ -f china-toys/catalog-guide.js ]; then cp china-toys/catalog-guide.js _site/china-toys/; fi
          if [ -d china-toys/tutorial ]; then cp -R china-toys/tutorial _site/china-toys/tutorial; fi
          if [ -f china-toys/compare.js ]; then cp china-toys/compare.js _site/china-toys/; fi
      - name: Copy China Toy IP ranking assets
        run: |
          if [ -f china-toys/ip-market-data.js ]; then
            cp china-toys/ip-market-data.js china-toys/ip-directory.js china-toys/ip-market.json china-toys/ip-coverage.json _site/china-toys/
          fi
      - name: Check market price grouping
        run: python3 china-toys/market_prices_test.py
      - name: Add dated source audit and exact-offer corrections
        run: |
          python3 china-toys/build_source_audit_report.py
          python3 china-toys/apply_source_audit.py --site _site/china-toys
          cp china-toys/research.html china-toys/research.css china-toys/research.js china-toys/source-audit.json china-toys/source-audit-data.js china-toys/source-audit.js _site/china-toys/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


