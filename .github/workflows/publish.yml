name: Publish Tariff Signal Mirror
on:
  push:
    branches: [main]
    paths: ['dog-club/**', 'pawlish/**', 'home-care/**', 'china-toys/**', 'luggage-atlas/**', 'tariff-signal/**', '.github/scripts/pages/**', '.github/workflows/publish.yml']
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main after acquiring the Pages lock
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage last complete Tariff homepage
        run: bash .github/scripts/pages/snapshot-ref.sh read _site
      - name: Add Pawlish English tutor
        run: python3 pawlish/download_assets.py _site/pawlish
      - name: Stage Home Care source records and photographs
        run: cp -R home-care/site _site/home-care
      - name: Build source-checked China Toy catalog
        run: |
          python3 china-toys/apply_chain_coverage.py --cache-images
          python3 china-toys/build_chain_assortments.py
          python3 china-toys/build_brand_directory.py
          python3 china-toys/build_retailer_stories.py --refresh-feeds
          cp -R china-toys _site/china-toys
          node china-toys/apply-product-scope.mjs _site/china-toys
          python3 china-toys/build_source_audit_report.py
          python3 china-toys/apply_source_audit.py --site _site/china-toys
          python3 china-toys/market_prices_test.py
      - name: Stage Luggage Atlas source records and photographs
        run: |
          python3 luggage-atlas/validate.py
          cp -R luggage-atlas _site/luggage-atlas
      - name: Build and validate simple search directories
        run: |
          python3 .github/scripts/pages/build-directories.py
          node --check .github/scripts/pages/directory/app.js
          node --test .github/scripts/pages/directory.test.cjs
      - name: Add Dog Club profile and comparison
        run: cp -R dog-club _site/dog-club
      - name: Verify source records and stamp the release
        run: python3 .github/scripts/pages/release.py manifest
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public pages and browser catalogs
        run: python3 .github/scripts/pages/release.py verify
