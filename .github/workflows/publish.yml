name: Publish Tariff Signal Mirror
on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Mirror complete public dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          import html, os
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          origin = "https://tariff-signal-directory.pages.dev/"
          headers = {"User-Agent": "Mozilla/5.0 Tariff-Signal-Mirror"}

          def fetch(url):
              with urlopen(Request(url, headers=headers), timeout=45) as response:
                  return response.read()

          document = fetch(origin)
          os.makedirs("_site", exist_ok=True)
          with open("_site/index.html", "wb") as output:
              output.write(document)

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ("href", "src"):
                      value = html.unescape(values.get(key, ""))
                      if value.startswith("/") and not value.startswith("//"):
                          self.urls.add(value)

          parser = Assets()
          parser.feed(document.decode("utf-8"))
          for asset in sorted(parser.urls):
              parsed = urlparse(asset)
              path = parsed.path.lstrip("/")
              if not path or path.endswith("/"):
                  continue
              target = os.path.join("_site", path)
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with open(target, "wb") as output:
                  output.write(fetch(urljoin(origin, asset)))
              print("mirrored", path)

          open("_site/.nojekyll", "w").close()
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
