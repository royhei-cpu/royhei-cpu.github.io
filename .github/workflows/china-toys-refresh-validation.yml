name: Validate China Toy refresh proposal
'on':
  pull_request:
    branches:
    - main
    paths:
    - china-toys/**
    - .github/scripts/pages/**
    - .github/workflows/china-toys-refresh*.yml
permissions:
  contents: read
concurrency:
  group: china-toys-refresh-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install collection and validation dependencies
      run: 'pip install requests beautifulsoup4 Pillow playwright

        python -m playwright install --with-deps chromium webkit

        '
    - name: Validate code
      run: 'python -m py_compile china-toys/rolife_collection.py china-toys/refresh.py china-toys/enhance.py china-toys/quality.py
        china-toys/review.py china-toys/review_finalize.py china-toys/review_publish.py china-toys/navigation_fix.py china-toys/navigation_test.py
        china-toys/install_compare.py china-toys/compare_test.py

        node --check china-toys/app.js

        node --check china-toys/compare.js

        '
    - name: Test generated-data maintenance
      run: 'python china-toys/test_refresh_contract.py

        python china-toys/test_chain_report_consistency.py

        python .github/scripts/test_push_generated.py

        python .github/scripts/test_writer_workflows.py

        bash -n .github/scripts/push-generated.sh

        '
    - name: Check market price grouping
      run: python china-toys/market_prices_test.py
    - name: Snapshot preservation baseline
      run: python china-toys/validate_refresh_contract.py snapshot --baseline /tmp/china-toys-baseline.json
    - name: Collect products and preserve exact-item evidence
      run: "python china-toys/apply_source_audit.py --config\npython china-toys/enhance.py\npython china-toys/quality.py\n\
        python - <<'PY'\nimport json,pathlib\np=pathlib.Path('china-toys/catalog.json');d=json.loads(p.read_text())\nif not\
        \ any(s.get('status')=='complete' for s in d.get('sources',[])):\n  raise RuntimeError('No source completed; refusing\
        \ to publish a false successful refresh')\nd['last_full_collection']=d['updated'];p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')))\n\
        PY\npython china-toys/review_publish.py\npython china-toys/apply_chain_coverage.py --cache-images\npython china-toys/build_chain_assortments.py\
        \ --check-sources\npython china-toys/apply_source_audit.py\npython china-toys/build_ip_directory.py\npython china-toys/build_brand_directory.py\n\
        python china-toys/navigation_fix.py\npython china-toys/install_weekly_brief.py\npython china-toys/install_compare.py\n\
        python china-toys/install_item_insights.py\nnode --check china-toys/app.js\nnode --check china-toys/catalog-guide.js\n\
        node --check china-toys/compare.js\n"
    - name: Validate retained source-page compatibility
      run: 'python china-toys/review_acceptance.py

        python china-toys/weekly_brief_test.py

        python china-toys/china_intelligence_test.py

        python china-toys/navigation_test.py

        python china-toys/test_ip_directory.py

        python china-toys/compare_test.py

        python china-toys/clarity_test.py

        python china-toys/chain_coverage_test.py

        python china-toys/brand_directory_test.py

        '
    - name: Validate the simplified public directories before saving
      run: 'mkdir -p _site

        cp -R home-care/site _site/home-care

        cp -R china-toys _site/china-toys

        node china-toys/apply-product-scope.mjs _site/china-toys

        python china-toys/build_source_audit_report.py

        python china-toys/apply_source_audit.py --site _site/china-toys

        python china-toys/market_prices_test.py

        python luggage-atlas/validate.py

        cp -R luggage-atlas _site/luggage-atlas

        python .github/scripts/pages/build-directories.py

        node --check .github/scripts/pages/directory/app.js

        node --test .github/scripts/pages/directory.test.cjs

        python china-toys/validate_refresh_contract.py check --baseline /tmp/china-toys-baseline.json --site _site/china-toys
        --browser

        '
    - name: Keep audit and UI evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: china-toys-audit
        path: '/tmp/china-toys-baseline.json

          /tmp/china-toys-directory-qa/

          china-toys/catalog.json

          china-toys/ip-coverage.json

          china-toys/report.json

          china-toys/review-report.json

          /tmp/china-toys-review-qa/results.json

          /tmp/china-toys-review-qa/*.png

          /tmp/china-toys-weekly-brief-qa/

          /tmp/china-toys-china-desk-qa/

          /tmp/china-toys-navigation-qa/

          /tmp/china-toys-compare-audit/

          '
        retention-days: 14
